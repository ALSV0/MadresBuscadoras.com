<body>



    <main class="contacto">

        <!-- TÍTULO -->
        <h1 class="titulo">CONTACTOS</h1>


        <!-- MARCADOR DE UBICACIÓN -->
        <button
            class="ubicacion"
            aria-label="Abrir ubicación en Google Maps"
            type="button"
        >
            <span class="pulso"></span>
            <span class="marcador"></span>
        </button>


        <!-- BOTÓN SUSCRIBIRSE -->
        <button
            class="suscribirse"
            id="suscribirse"
            type="button"
            aria-expanded="false"
        >
            <span>SUSCRIBIRSE</span>
        </button>


        <!-- PANEL DE SUSCRIPCIÓN -->
        <section
            class="panel-suscripcion"
            id="panelSuscripcion"
            aria-hidden="true"
        >

            <form class="formulario" id="formulario">

                <!-- NOMBRE -->
                <div class="campo">
                    <input
                        type="text"
                        id="nombre"
                        name="nombre"
                        placeholder="nombre y apellido"
                        autocomplete="name"
                        required
                    >
                </div>


                <!-- CORREO -->
                <div class="campo">
                    <input
                        type="email"
                        id="correo"
                        name="correo"
                        placeholder="correo electrónico"
                        autocomplete="email"
                        required
                    >
                </div>


                <!-- MENSAJE -->
                <div class="campo">
                    <textarea
                        id="mensaje"
                        name="mensaje"
                        placeholder="mensaje (opcional)"
                    ></textarea>
                </div>


                <!-- TEXTO -->
                <p class="texto-suscripcion">
                    Seguí de cerca las historias, encuentros y
                    nuevas voces que continúan buscando respuestas.
                </p>


                <!-- ENVIAR -->
                <button
                    class="enviar"
                    type="submit"
                    id="enviar"
                >
                    ENVIAR
                </button>


                <!-- INSTAGRAM -->
                <p class="instagram">
                    IG: @madresunidaseindependientes
                </p>

            </form>

        </section>

    </main>
